openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: porting
    description: HTML portability analysis and Poe bridge operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /port/analyze:
    post:
      operationId: analyzeHtml
      tags: [porting]
      summary: Analyze imported HTML for Replit portability
      description: Inspects a normalized source bundle (or a legacy single HTML document) for portability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HtmlInput"
      responses:
        "200":
          description: Portability report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HtmlAnalysis"
        "400":
          description: Invalid HTML input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/hosted-url:
    post:
      operationId: importHostedUrl
      tags: [porting]
      summary: Import a public hosted HTML page
      description: Fetches one public HTML document server-side with SSRF, redirect, timeout, and size protections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostedUrlInput"
      responses:
        "200":
          description: Hosted HTML source bundle and fetch diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedUrlImport"
        "400":
          description: Invalid or unsafe hosted URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Hosted HTML response is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Hosted URL import rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Hosted page could not be fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/playground/import:
    post:
      operationId: importPlayground
      tags: [porting]
      summary: Import a public CodePen or JSFiddle playground
      description: Recognizes supported public playground URLs and fetches only provider-owned export or rendered-result endpoints server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaygroundImportInput"
      responses:
        "200":
          description: Normalized playground source bundle with attribution and limitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaygroundImport"
        "400":
          description: Unsupported, malformed, credentialed, empty, or unsafe playground URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Playground export exceeds importer limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Playground import rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Provider export could not be fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/github/repository:
    get:
      operationId: getGithubRepository
      tags: [porting]
      summary: Inspect a public GitHub repository and list selectable refs
      description: Resolves public repository metadata and branch choices without requesting GitHub credentials.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: Public repository metadata and refs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubRepository"
        "400":
          description: Malformed or unsupported GitHub URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Repository is missing or private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: GitHub public API rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: GitHub could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/github/import:
    post:
      operationId: importGithubRepository
      tags: [porting]
      summary: Import a pinned public GitHub repository snapshot
      description: Downloads only bounded, approved text files from a public repository at a resolved commit. Repository code is never executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubImportInput"
      responses:
        "200":
          description: Normalized public repository source bundle and analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubImport"
        "400":
          description: Invalid URL or ref
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Repository, ref, or HTML entrypoint was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: More than one safe HTML entrypoint needs an explicit choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubEntrypointChoice"
        "413":
          description: Snapshot exceeds importer limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: GitHub public API rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: GitHub could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/poe/models:
    get:
      operationId: listPoeModels
      tags: [porting]
      summary: List Poe models available to the configured server key
      responses:
        "200":
          description: Available Poe models and configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeModels"
  /port/poe/chat:
    post:
      operationId: chatWithPoe
      tags: [porting]
      summary: Send an OpenAI-compatible chat request through Poe
      description: Proxies a chat completion through Poe so the API key never reaches the browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoeChatInput"
      responses:
        "200":
          description: Poe chat completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeChatResponse"
        "400":
          description: Invalid chat request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Poe is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-project-connection:
    get:
      operationId: getReplitProjectConnection
      tags: [porting]
      summary: Check whether Replit project creation is connected
      description: Reports whether the API server can use the attached authorized Replit project-creation connection. No credentials are returned.
      responses:
        "200":
          description: Connection availability for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectConnectionStatus"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-project-connection/setup:
    get:
      operationId: getReplitProjectConnectionSetup
      tags: [porting]
      summary: Get the Replit project creation setup link
      description: Returns Replit’s authenticated connection setup URL. Replit verifies workspace-owner eligibility; no credentials are returned.
      responses:
        "200":
          description: Project-creation connection setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectConnectionSetup"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-projects:
    post:
      operationId: createReplitProject
      tags: [porting]
      summary: Create a Replit project from the analyzed HTML
      description: Sends the imported HTML unchanged through the server-only authorized Replit project connection and starts the ordered setup workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplitProjectInput"
      responses:
        "202":
          description: Project creation job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectHandoff"
        "400":
          description: Invalid or unsafe HTML handoff request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: HTML source is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Authorized Replit project connection is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-projects/{jobId}:
    get:
      operationId: getReplitProjectStatus
      tags: [porting]
      summary: Get Replit project creation and setup status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Current handoff status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectHandoff"
        "404":
          description: Handoff job was not found or has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-projects/{jobId}/retry:
    post:
      operationId: retryReplitProjectSetup
      tags: [porting]
      summary: Retry a failed Replit project setup step
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "202":
          description: Failed setup step queued for retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectHandoff"
        "400":
          description: Job is not in a retryable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Handoff job was not found or has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Authorized Replit project connection is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        action:
          type: string
      required: [error]
    SourceType:
      type: string
      enum: [pasted_html, single_file, zip_project, github_repository, hosted_page, playground]
    SourceBundleFile:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 512
        content:
          type: string
          maxLength: 1000000
    SourceBundleMetadata:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        sourceUrl:
          type: string
        originalUrl:
          type: string
        finalUrl:
          type: string
        warnings:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 500
        resolvedRef:
          type: string
          maxLength: 256
        resolvedCommitSha:
          type: string
          maxLength: 64
        entrypointCandidates:
          type: array
          maxItems: 20
          items:
            type: string
    SourceBundle:
      type: object
      required: [version, sourceType, files, entrypoint, metadata]
      properties:
        version:
          type: integer
          enum: [1]
        sourceType:
          $ref: "#/components/schemas/SourceType"
        files:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/SourceBundleFile"
        entrypoint:
          type: string
          minLength: 1
          maxLength: 512
        metadata:
          $ref: "#/components/schemas/SourceBundleMetadata"
    HtmlInput:
      type: object
      properties:
        html:
          type: string
          minLength: 1
          maxLength: 2000000
        bundle:
          $ref: "#/components/schemas/SourceBundle"
      anyOf:
        - required: [html]
        - required: [bundle]
    HostedUrlInput:
      type: object
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
      required: [url]
    HostedUrlImportStatus:
      type: string
      enum: [fetched]
    HostedUrlImport:
      type: object
      properties:
        originalUrl:
          type: string
        finalUrl:
          type: string
        status:
          $ref: "#/components/schemas/HostedUrlImportStatus"
        bundle:
          $ref: "#/components/schemas/SourceBundle"
        warnings:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 500
      required: [originalUrl, finalUrl, status, bundle, warnings]
    PlaygroundProvider:
      type: string
      enum: [codepen, jsfiddle]
    PlaygroundImportInput:
      type: object
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 512
      required: [url]
    PlaygroundImportStatus:
      type: string
      enum: [imported]
    PlaygroundImport:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/PlaygroundProvider"
        originalUrl:
          type: string
        status:
          $ref: "#/components/schemas/PlaygroundImportStatus"
        bundle:
          $ref: "#/components/schemas/SourceBundle"
        warnings:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 500
      required: [provider, originalUrl, status, bundle, warnings]
    PortFinding:
      type: object
      properties:
        severity:
          type: string
          enum: [info, warning, blocker]
        title:
          type: string
        detail:
          type: string
        action:
          type: string
      required: [severity, title, detail, action]
    HtmlAnalysis:
      type: object
      properties:
        title:
          type: string
        bytes:
          type: number
        scriptCount:
          type: number
        externalScriptCount:
          type: number
        inlineScriptCount:
          type: number
        externalAssetCount:
          type: number
        aiSignalCount:
          type: number
        findings:
          type: array
          items:
            $ref: "#/components/schemas/PortFinding"
        steps:
          type: array
          items:
            type: string
        sourceType:
          $ref: "#/components/schemas/SourceType"
        entrypoint:
          type: string
        fileCount:
          type: number
        totalBytes:
          type: number
        files:
          type: array
          items:
            type: string
        localAssetReferences:
          type: array
          items:
            type: string
        externalDependencies:
          type: array
          items:
            type: string
      required:
        - title
        - bytes
        - scriptCount
        - externalScriptCount
        - inlineScriptCount
        - externalAssetCount
        - aiSignalCount
        - findings
        - steps
        - sourceType
        - entrypoint
        - fileCount
        - totalBytes
        - files
        - localAssetReferences
        - externalDependencies
    GithubRef:
      type: object
      properties:
        name:
          type: string
        sha:
          type: string
          minLength: 7
          maxLength: 64
      required: [name, sha]
    GithubRepository:
      type: object
      properties:
        sourceUrl:
          type: string
        fullName:
          type: string
        displayName:
          type: string
        defaultBranch:
          type: string
        description:
          type: ["string", "null"]
        stars:
          type: number
        refs:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/GithubRef"
      required: [sourceUrl, fullName, displayName, defaultBranch, description, stars, refs]
    GithubImportInput:
      type: object
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 512
        ref:
          type: string
          minLength: 1
          maxLength: 256
        entrypoint:
          type: string
          minLength: 1
          maxLength: 512
      required: [url, ref]
    GithubEntrypointChoice:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        entrypointCandidates:
          type: array
          maxItems: 20
          items:
            type: string
      required: [error, code, entrypointCandidates]
    GithubImport:
      type: object
      properties:
        bundle:
          $ref: "#/components/schemas/SourceBundle"
        analysis:
          $ref: "#/components/schemas/HtmlAnalysis"
        repository:
          $ref: "#/components/schemas/GithubRepository"
        resolvedRef:
          type: string
        resolvedCommitSha:
          type: string
        entrypointCandidates:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
      required: [bundle, analysis, repository, resolvedRef, resolvedCommitSha, entrypointCandidates, warnings]
    PoeModels:
      type: object
      properties:
        configured:
          type: boolean
        models:
          type: array
          items:
            type: string
        message:
          type: string
      required: [configured, models, message]
    PoeMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
      required: [role, content]
    PoeChatInput:
      type: object
      properties:
        model:
          type: string
          minLength: 1
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/PoeMessage"
        maxTokens:
          type: number
          minimum: 1
          maximum: 8192
      required: [model, messages]
    PoeChatResponse:
      type: object
      properties:
        content:
          type: string
        model:
          type: string
        usage:
          type: object
          properties:
            promptTokens:
              type: number
            completionTokens:
              type: number
          required: [promptTokens, completionTokens]
      required: [content, model]
    ReplitProjectConnectionStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [connected, setup_required]
    ReplitProjectConnectionSetup:
      type: object
      required: [status, setupUrl]
      properties:
        status:
          type: string
          enum: [connected, setup_required]
        setupUrl:
          type: ["string", "null"]
    ReplitProjectInput:
      type: object
      properties:
        html:
          type: string
          minLength: 1
          maxLength: 2000000
        bundle:
          $ref: "#/components/schemas/SourceBundle"
      anyOf:
        - required: [html]
        - required: [bundle]
    ReplitProjectStepName:
      type: string
      enum:
        - Poe Setup
        - Port Authority
        - Failure Gate
        - Harden Bug Fixes
        - Skill Install Confirmation
    ReplitProjectStepStatus:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/ReplitProjectStepName"
        status:
          type: string
          enum: [pending, running, completed, failed]
        error:
          type: ["string", "null"]
      required: [name, status, error]
    ReplitProjectHandoff:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        projectId:
          type: ["string", "null"]
        projectUrl:
          type: ["string", "null"]
        projectName:
          type: ["string", "null"]
        currentStep:
          allOf:
            - $ref: "#/components/schemas/ReplitProjectStepName"
          nullable: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ReplitProjectStepStatus"
        error:
          type: ["string", "null"]
      required:
        - jobId
        - status
        - projectId
        - projectUrl
        - projectName
        - currentStep
        - steps
        - error

