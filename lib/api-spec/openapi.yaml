          type: object
          properties:
            toolCalling:
              type: string
              enum: [available, unavailable]
            vision:
              type: string
              enum: [available, unavailable]
            structuredOutput:
              type: string
              enum: [available, unavailable]
            streaming:
              type: string
              enum: [available, unavailable]
          required: [toolCalling, vision, structuredOutput, streaming]
      required: [version, id, endpoint, contract, privacyClass, limits, fallback, owner, reviewEvidence, capabilities]
