openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: porting
    description: HTML portability analysis and Poe bridge operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /port/analyze:
    post:
      operationId: analyzeHtml
      tags: [porting]
      summary: Analyze imported HTML for Replit portability
      description: Inspects a normalized source bundle (or a legacy single HTML document) for portability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HtmlInput"
      responses:
        "200":
          description: Portability report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HtmlAnalysis"
        "400":
          description: Invalid HTML input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/hosted-url:
    post:
      operationId: importHostedUrl
      tags: [porting]
      summary: Import a public hosted HTML page
      description: Fetches one public HTML document server-side with SSRF, redirect, timeout, and size protections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostedUrlInput"
      responses:
        "200":
          description: Hosted HTML source bundle and fetch diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedUrlImport"
        "400":
          description: Invalid or unsafe hosted URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportErrorResponse"
        "413":
          description: Hosted HTML response is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportErrorResponse"
        "429":
          description: Hosted URL import rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportErrorResponse"
        "502":
          description: Hosted page could not be fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportErrorResponse"
  /port/playground/import:
    post:
      operationId: importPlayground
      tags: [porting]
      summary: Import a public CodePen or JSFiddle playground
      description: Recognizes supported public playground URLs and fetches only provider-owned export or rendered-result endpoints server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaygroundImportInput"
      responses:
        "200":
          description: Normalized playground source bundle with attribution and limitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaygroundImport"
        "400":
          description: Unsupported, malformed, credentialed, empty, or unsafe playground URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportErrorResponse"
        "413":
          description: Playground export exceeds importer limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportErrorResponse"
        "429":
          description: Playground import rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportErrorResponse"
        "502":
          description: Provider export could not be fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportErrorResponse"
  /port/github/repository:
    get:
      operationId: getGithubRepository
      tags: [porting]
      summary: Inspect a public GitHub repository and list selectable refs
      description: Resolves public repository metadata and branch choices without requesting GitHub credentials.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: Public repository metadata and refs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubRepository"
        "400":
          description: Malformed or unsupported GitHub URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Repository is missing or private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: GitHub public API rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: GitHub could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/github/import:
    post:
      operationId: importGithubRepository
      tags: [porting]
      summary: Import a pinned public GitHub repository snapshot
      description: Downloads only bounded, approved text files from a public repository at a resolved commit. Repository code is never executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubImportInput"
      responses:
        "200":
          description: Normalized public repository source bundle and analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubImport"
        "400":
          description: Invalid URL or ref
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Repository, ref, or HTML entrypoint was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: More than one safe HTML entrypoint needs an explicit choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubEntrypointChoice"
        "413":
          description: Snapshot exceeds importer limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: GitHub public API rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: GitHub could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/poe/models:
    get:
      operationId: listPoeModels
      tags: [porting]
      summary: List Poe models available to the configured server key
      description: Requires an authenticated Studio session. Model identifiers are exact, case-sensitive values from the live Poe catalogue; provider credentials never reach the browser.
      responses:
        "200":
          description: Available Poe models and configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeModels"
        "401":
          description: An authenticated Studio session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Poe model availability could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeErrorResponse"
  /port/poe/chat:
    post:
      operationId: chatWithPoe
      tags: [porting]
      summary: Send an OpenAI-compatible chat request through Poe
      description: Requires an authenticated Studio session and proxies a text-only chat completion through Poe so the API key never reaches the browser. The selected model and capability must be confirmed by the live catalogue and server registry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoeChatInput"
      responses:
        "200":
          description: Poe chat completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeChatResponse"
        "400":
          description: Invalid chat request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeErrorResponse"
        "401":
          description: An authenticated Studio session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Chat request exceeds the server request byte limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeErrorResponse"
        "429":
          description: Too many chat requests from the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeErrorResponse"
        "503":
          description: Poe is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeErrorResponse"
  /port/replit-project-connection:
    get:
      operationId: getReplitProjectConnection
      tags: [porting]
      deprecated: true
      summary: Legacy automatic project creation status
      description: Legacy endpoint retained for compatibility. HTML Port Studio does not use or present an automatic project-creation connector; an external Replit MCP client creates the destination project.
      responses:
        "200":
          description: Connection availability for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectConnectionStatus"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-project-connection/setup:
    get:
      operationId: getReplitProjectConnectionSetup
      tags: [porting]
      deprecated: true
      summary: Legacy automatic project creation setup
      description: Legacy endpoint retained for compatibility. Do not use it for new handoffs; use an external Replit MCP client for project creation and the owner-bound bundle transfer endpoints for exact files.
      responses:
        "200":
          description: Project-creation connection setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectConnectionSetup"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/bundle-transfers:
    post:
      operationId: createBundleTransfer
      tags: [porting]
      summary: Create a short-lived secure bundle transfer
      description: Creates one owner-bound, credential-cleared transfer package. The opaque token is returned once and must be stored only in the destination project's Replit Secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundleTransferInput"
      responses:
        "201":
          description: Transfer package created; the token is shown only for initial secret setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleTransferCreated"
        "400":
          description: Bundle is not approved, normalized, safe, or credential-cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Bundle exceeds transfer limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/bundle-transfers/{transferId}:
    get:
      operationId: getBundleTransfer
      tags: [porting]
      summary: Inspect an owner's secure bundle transfer
      description: Returns transfer metadata and a source-free manifest. Ownership is enforced by the signed-in session.
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transfer metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleTransfer"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transfer is not owned by the caller or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/bundle-transfers/{transferId}/revoke:
    post:
      operationId: revokeBundleTransfer
      tags: [porting]
      summary: Revoke a secure bundle transfer
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transfer is revoked; repeating the operation is safe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleTransfer"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transfer is not owned by the caller or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/bundle-transfers/{transferId}/complete:
    post:
      operationId: completeBundleTransfer
      tags: [porting]
      summary: Complete a secure bundle transfer
      description: Invalidates future destination retrieval while retaining the owner's recoverable transfer record.
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transfer is completed; repeating the operation is safe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleTransfer"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transfer is not owned by the caller or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/bundle-transfers/{transferId}/manifest:
    get:
      operationId: getBundleTransferManifest
      tags: [porting]
      summary: Retrieve a bundle transfer manifest
      description: Retrieves only the source-free manifest with the opaque transfer token in the Authorization header.
      security:
        - bundleTransferToken: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bundle manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleTransferManifestResponse"
        "404":
          description: Transfer token is missing, invalid, expired, revoked, tampered, or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/bundle-transfers/{transferId}/bundle:
    get:
      operationId: getBundleTransferBundle
      tags: [porting]
      summary: Retrieve a bundle transfer
      description: Retrieves the exact normalized bundle once the opaque transfer token is supplied in the Authorization header.
      security:
        - bundleTransferToken: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exact normalized source bundle and its manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleTransferBundleResponse"
        "404":
          description: Transfer token is missing, invalid, expired, revoked, tampered, overused, or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-projects:
    post:
      operationId: createReplitProject
      tags: [porting]
      deprecated: true
      summary: Legacy automatic project handoff
      description: Legacy endpoint retained for compatibility. New handoffs must not send source through an automatic connector; MCP creates the destination project and the pinned importer retrieves the exact bundle from the secure transfer package.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplitProjectInput"
      responses:
        "202":
          description: Project creation job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectHandoff"
        "400":
          description: Invalid or unsafe HTML handoff request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: HTML source is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Authorized Replit project connection is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-projects/{jobId}:
    get:
      operationId: getReplitProjectStatus
      tags: [porting]
      deprecated: true
      summary: Get legacy automatic project handoff status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Current handoff status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectHandoff"
        "404":
          description: Handoff job was not found or has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-projects/{jobId}/retry:
    post:
      operationId: retryReplitProjectSetup
      tags: [porting]
      deprecated: true
      summary: Retry a legacy automatic project setup step
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "202":
          description: Failed setup step queued for retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectHandoff"
        "400":
          description: Job is not in a retryable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Handoff job was not found or has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Authorized Replit project connection is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bundleTransferToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        action:
          type: string
      required: [error]
    PoeErrorCode:
      type: string
      description: Stable safe Poe route failures. Provider response bodies and credentials are never returned.
      enum:
        - POE_INVALID_REQUEST
        - POE_CHAT_REQUEST_TOO_LARGE
        - POE_TOKEN_LIMIT_EXCEEDED
        - CHAT_CONTAINS_CREDENTIAL
        - POE_CAPABILITY_UNAVAILABLE
        - POE_MODEL_UNAVAILABLE
        - POE_NOT_CONFIGURED
        - POE_AUTHENTICATION_FAILED
        - POE_RATE_LIMITED
        - POE_RATE_LIMIT_UNAVAILABLE
        - POE_TIMEOUT
        - POE_PROVIDER_UNAVAILABLE
        - POE_COMPLETION_INVALID
    PoeErrorResponse:
      type: object
      description: Safe, stable Poe failure details. retryAfterSeconds is bounded by the server and is also sent as Retry-After when present.
      properties:
        error:
          type: string
        code:
          $ref: "#/components/schemas/PoeErrorCode"
        action:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 60
      required: [error, code]
    ImportErrorCode:
      type: string
      description: Stable, safe error identifiers emitted by hosted and playground imports.
      enum:
        - HOSTED_URL_INVALID
        - HOSTED_URL_UNSUPPORTED_PROTOCOL
        - HOSTED_URL_HTTP_DISABLED
        - HOSTED_URL_CREDENTIALS
        - HOSTED_URL_PORT_NOT_ALLOWED
        - HOSTED_URL_BLOCKED_HOST
        - HOSTED_URL_DNS_FAILED
        - HOSTED_URL_DNS_REBINDING
        - HOSTED_URL_REDIRECT_INVALID
        - HOSTED_URL_TOO_MANY_REDIRECTS
        - HOSTED_URL_TIMEOUT
        - HOSTED_URL_RATE_LIMITED
        - HOSTED_URL_TOO_LARGE
        - HOSTED_URL_NOT_HTML
        - HOSTED_URL_HTTP_ERROR
        - HOSTED_URL_FETCH_FAILED
        - PLAYGROUND_URL_INVALID
        - PLAYGROUND_URL_UNSUPPORTED_PROTOCOL
        - PLAYGROUND_URL_CREDENTIALS
        - PLAYGROUND_URL_PORT_NOT_ALLOWED
        - PLAYGROUND_URL_UNSUPPORTED_FORM
        - PLAYGROUND_PROVIDER_UNSUPPORTED
        - PLAYGROUND_UNSAFE_DESTINATION
        - PLAYGROUND_REDIRECT_UNSAFE
        - PLAYGROUND_TIMEOUT
        - PLAYGROUND_RATE_LIMITED
        - PLAYGROUND_RESPONSE_TOO_LARGE
        - PLAYGROUND_EMPTY
        - PLAYGROUND_PROVIDER_UNAVAILABLE
    ImportErrorResponse:
      type: object
      description: Safe, actionable failure details for hosted and playground imports.
      properties:
        error:
          type: string
          description: User-facing explanation that does not include upstream or private-network details.
        code:
          $ref: "#/components/schemas/ImportErrorCode"
        action:
          type: string
          description: Recommended next step for recovering from the import failure.
      required: [error, code, action]
    SourceType:
      type: string
      enum: [pasted_html, single_file, zip_project, github_repository, hosted_page, playground]
    SourceBundleFile:
      # Shared import compatibility boundary for hosted, GitHub, playground,
      # ZIP, direct analysis, and project handoff source content.
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 512
        content:
          type: string
          maxLength: 2097152
    SourceBundleMetadata:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        sourceUrl:
          type: string
        originalUrl:
          type: string
        finalUrl:
          type: string
        warnings:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 500
        resolvedRef:
          type: string
          maxLength: 256
        resolvedCommitSha:
          type: string
          maxLength: 64
        entrypointCandidates:
          type: array
          maxItems: 20
          items:
            type: string
    SourceBundle:
      type: object
      required: [version, sourceType, files, entrypoint, metadata]
      properties:
        version:
          type: number
          enum: [1]
        sourceType:
          $ref: "#/components/schemas/SourceType"
        files:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/SourceBundleFile"
        entrypoint:
          type: string
          minLength: 1
          maxLength: 512
        metadata:
          $ref: "#/components/schemas/SourceBundleMetadata"
    BundleTransferInput:
      type: object
      required: [approved, bundle]
      properties:
        approved:
          type: boolean
          const: true
          description: The signed-in owner confirms this is the currently reviewed normalized bundle.
        bundle:
          $ref: "#/components/schemas/SourceBundle"
    BundleTransferManifestFile:
      type: object
      required: [path, bytes, sha256]
      properties:
        path:
          type: string
        bytes:
          type: number
          minimum: 0
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    BundleTransferManifest:
      type: object
      required: [version, sourceType, entrypoint, fileCount, totalBytes, files, bundleSha256]
      properties:
        version:
          type: number
          enum: [1]
        sourceType:
          $ref: "#/components/schemas/SourceType"
        entrypoint:
          type: string
        fileCount:
          type: number
          minimum: 1
        totalBytes:
          type: number
          minimum: 1
        files:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/BundleTransferManifestFile"
        bundleSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    BundleTransfer:
      type: object
      required: [transferId, manifestHash, manifest, expiresAt, retrievalLimit, retrievalCount, state, revokedAt, completedAt, createdAt]
      properties:
        transferId:
          type: string
        manifestHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        manifest:
          $ref: "#/components/schemas/BundleTransferManifest"
        expiresAt:
          type: string
          format: date-time
        retrievalLimit:
          type: number
          minimum: 1
        retrievalCount:
          type: number
          minimum: 0
        state:
          type: string
          enum: [active, expired, revoked, completed, exhausted]
        revokedAt:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    BundleTransferCreated:
      allOf:
        - $ref: "#/components/schemas/BundleTransfer"
        - type: object
          required: [transferToken, instructions]
          properties:
            transferToken:
              type: string
              minLength: 32
            instructions:
              type: string
    BundleTransferManifestResponse:
      type: object
      required: [transferId, manifestHash, manifest, expiresAt]
      properties:
        transferId:
          type: string
        manifestHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        manifest:
          $ref: "#/components/schemas/BundleTransferManifest"
