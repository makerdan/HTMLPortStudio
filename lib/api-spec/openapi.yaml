openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: porting
    description: HTML portability analysis and Poe bridge operations
  - name: Auth
    description: Browser authentication endpoints
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [Auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [Auth]
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC provider
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [Auth]
      summary: Complete the browser OIDC login flow
      responses:
        "302":
          description: Redirect after login
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [Auth]
      summary: Clear the browser session
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect after logout
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /port/analyze:
    post:
      operationId: analyzeHtml
      tags: [porting]
      summary: Analyze imported HTML for Replit portability
      description: Inspects a normalized source bundle (or a legacy single HTML document) for portability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HtmlInput"
      responses:
        "200":
          description: Portability report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HtmlAnalysis"
        "400":
          description: Invalid HTML input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/poe/models:
    get:
      operationId: listPoeModels
      tags: [porting]
      summary: List Poe models available to the configured server key
      responses:
        "200":
          description: Available Poe models and configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeModels"
  /port/poe/chat:
    post:
      operationId: chatWithPoe
      tags: [porting]
      summary: Send an OpenAI-compatible chat request through Poe
      description: Proxies a chat completion through Poe so the API key never reaches the browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoeChatInput"
      responses:
        "200":
          description: Poe chat completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoeChatResponse"
        "400":
          description: Invalid chat request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Poe is not configured or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-project-connection:
    get:
      operationId: getReplitProjectConnection
      tags: [porting]
      summary: Check whether Replit project creation is connected
      description: Reports whether the API server can use the attached authorized Replit project-creation connection. No credentials are returned.
      responses:
        "200":
          description: Connection availability for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectConnectionStatus"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-project-connection/setup:
    get:
      operationId: getReplitProjectConnectionSetup
      tags: [porting]
      summary: Get the Replit project creation setup link
      description: Returns Replit’s authenticated connection setup URL. Replit verifies workspace-owner eligibility; no credentials are returned.
      responses:
        "200":
          description: Project-creation connection setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectConnectionSetup"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-projects:
    post:
      operationId: createReplitProject
      tags: [porting]
      summary: Create a Replit project from the analyzed HTML
      description: Sends the imported HTML unchanged through the server-only authorized Replit project connection and starts the ordered setup workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplitProjectInput"
      responses:
        "202":
          description: Project creation job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectHandoff"
        "400":
          description: Invalid or unsafe HTML handoff request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: HTML source is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Authorized Replit project connection is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-projects/{jobId}:
    get:
      operationId: getReplitProjectStatus
      tags: [porting]
      summary: Get Replit project creation and setup status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Current handoff status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectHandoff"
        "404":
          description: Handoff job was not found or has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /port/replit-projects/{jobId}/retry:
    post:
      operationId: retryReplitProjectSetup
      tags: [porting]
      summary: Retry a failed Replit project setup step
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "202":
          description: Failed setup step queued for retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplitProjectHandoff"
        "400":
          description: Job is not in a retryable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Handoff job was not found or has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Authorized Replit project connection is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        action:
          type: string
      required: [error]
    SourceType:
      type: string
      enum: [pasted_html, single_file, zip_project, github_repository, hosted_page, playground]
    SourceBundleFile:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 512
        content:
          type: string
          maxLength: 1000000
    SourceBundleMetadata:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        sourceUrl:
          type: string
        warnings:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 500
    SourceBundle:
      type: object
      required: [version, sourceType, files, entrypoint, metadata]
      properties:
        version:
          type: integer
          enum: [1]
        sourceType:
          $ref: "#/components/schemas/SourceType"
        files:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/SourceBundleFile"
        entrypoint:
          type: string
          minLength: 1
          maxLength: 512
        metadata:
          $ref: "#/components/schemas/SourceBundleMetadata"
    HtmlInput:
      type: object
      properties:
        html:
          type: string
          minLength: 1
          maxLength: 2000000
        bundle:
          $ref: "#/components/schemas/SourceBundle"
      anyOf:
        - required: [html]
        - required: [bundle]
    PortFinding:
      type: object
      properties:
        severity:
          type: string
          enum: [info, warning, blocker]
        title:
          type: string
        detail:
          type: string
        action:
          type: string
      required: [severity, title, detail, action]
    HtmlAnalysis:
      type: object
      properties:
        title:
          type: string
        bytes:
          type: number
        scriptCount:
          type: number
        externalScriptCount:
          type: number
        inlineScriptCount:
          type: number
        externalAssetCount:
          type: number
        aiSignalCount:
          type: number
        findings:
          type: array
          items:
            $ref: "#/components/schemas/PortFinding"
        steps:
          type: array
          items:
            type: string
        sourceType:
          $ref: "#/components/schemas/SourceType"
        entrypoint:
          type: string
        fileCount:
          type: number
        totalBytes:
          type: number
        files:
          type: array
          items:
            type: string
      required:
        - title
        - bytes
        - scriptCount
        - externalScriptCount
        - inlineScriptCount
        - externalAssetCount
        - aiSignalCount
        - findings
        - steps
        - sourceType
        - entrypoint
        - fileCount
        - totalBytes
        - files
    PoeModels:
      type: object
      properties:
        configured:
          type: boolean
        models:
          type: array
          items:
            type: string
        message:
          type: string
      required: [configured, models, message]
    PoeMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
      required: [role, content]
    PoeChatInput:
      type: object
      properties:
        model:
          type: string
          minLength: 1
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/PoeMessage"
        maxTokens:
          type: number
          minimum: 1
          maximum: 8192
      required: [model, messages]
    PoeChatResponse:
      type: object
      properties:
        content:
          type: string
        model:
          type: string
        usage:
          type: object
          properties:
            promptTokens:
              type: number
            completionTokens:
              type: number
          required: [promptTokens, completionTokens]
      required: [content, model]
    ReplitProjectConnectionStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [connected, setup_required]
    ReplitProjectConnectionSetup:
      type: object
      required: [status, setupUrl]
      properties:
        status:
          type: string
          enum: [connected, setup_required]
        setupUrl:
          type: ["string", "null"]
    ReplitProjectInput:
      type: object
      properties:
        html:
          type: string
          minLength: 1
          maxLength: 2000000
        bundle:
          $ref: "#/components/schemas/SourceBundle"
      anyOf:
        - required: [html]
        - required: [bundle]
    ReplitProjectStepName:
      type: string
      enum:
        - Poe Setup
        - Port Authority
        - Failure Gate
        - Harden Bug Fixes
        - Skill Install Confirmation
    ReplitProjectStepStatus:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/ReplitProjectStepName"
        status:
          type: string
          enum: [pending, running, completed, failed]
        error:
          type: ["string", "null"]
      required: [name, status, error]
    ReplitProjectHandoff:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        projectId:
          type: ["string", "null"]
        projectUrl:
          type: ["string", "null"]
        projectName:
          type: ["string", "null"]
        currentStep:
          allOf:
            - $ref: "#/components/schemas/ReplitProjectStepName"
          nullable: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ReplitProjectStepStatus"
        error:
          type: ["string", "null"]
      required:
        - jobId
        - status
        - projectId
        - projectUrl
        - projectName
        - currentStep
        - steps
        - error

