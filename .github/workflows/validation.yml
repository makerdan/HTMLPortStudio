name: GitHub Validation

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-standard:
    name: test-standard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.26.1

      - name: Verify toolchain
        run: |
          test "$(node --version | sed 's/^v//' | cut -d. -f1)" = "24"
          test "$(pnpm --version)" = "10.26.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers and Linux dependencies
        run: pnpm --filter @workspace/html-port-studio exec playwright install --with-deps chromium firefox

      - name: Run canonical application validation
        run: pnpm run test-standard

      - name: Upload non-sensitive Playwright screenshots
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-screenshots-${{ github.run_id }}
          path: artifacts/html-port-studio/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3

  validate-api:
    name: validate-api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.26.1

      - name: Verify toolchain
        run: |
          test "$(node --version | sed 's/^v//' | cut -d. -f1)" = "24"
          test "$(pnpm --version)" = "10.26.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run generated API validation
        run: pnpm run validate:api

  validation:
    name: validation
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    needs:
      - test-standard
      - validate-api
      - production-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          TEST_STANDARD_RESULT: ${{ needs.test-standard.result }}
          VALIDATE_API_RESULT: ${{ needs.validate-api.result }}
          PRODUCTION_BUILD_RESULT: ${{ needs.production-build.result }}
        run: |
          set -eu
          for result in "$TEST_STANDARD_RESULT" "$VALIDATE_API_RESULT" "$PRODUCTION_BUILD_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Validation aggregate rejected upstream result: $result"
              exit 1
            fi
          done

  production-build:
    name: production-build
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.26.1

      - name: Verify toolchain
        run: |
          test "$(node --version | sed 's/^v//' | cut -d. -f1)" = "24"
          test "$(pnpm --version)" = "10.26.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical production build
        run: pnpm run production-build
