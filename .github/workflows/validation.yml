name: GitHub Validation

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-standard:
    name: test-standard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.26.1

      - name: Verify toolchain
        run: |
          test "$(node --version | sed 's/^v//' | cut -d. -f1)" = "24"
          test "$(pnpm --version)" = "10.26.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers and Linux dependencies
        run: pnpm --filter @workspace/html-port-studio exec playwright install --with-deps chromium firefox

      - name: Run canonical application validation
        run: pnpm run test-standard

      - name: Upload non-sensitive Playwright screenshots
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-screenshots-${{ github.run_id }}
          path: artifacts/html-port-studio/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3

  validate-api:
    name: validate-api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.26.1

      - name: Verify toolchain
        run: |
          test "$(node --version | sed 's/^v//' | cut -d. -f1)" = "24"
          test "$(pnpm --version)" = "10.26.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run generated API validation
        run: pnpm run validate:api

  validation:
    name: validation
    if: ${{ always() }}
    needs:
      - test-standard
      - validate-api
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          TEST_STANDARD_RESULT: ${{ needs.test-standard.result }}
          VALIDATE_API_RESULT: ${{ needs.validate-api.result }}
        run: |
          set -eu
          for result in "$TEST_STANDARD_RESULT" "$VALIDATE_API_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Validation aggregate rejected upstream result: $result"
              exit 1
            fi
          done
