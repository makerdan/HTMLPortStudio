name: GitHub Validation

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-standard:
    name: test-standard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI_EVIDENCE_FILE: ${{ runner.temp }}/ci-evidence-test-standard.json
      CI_EVIDENCE_ARTIFACT_FILE: ${{ runner.temp }}/ci-evidence-test-standard.artifact.json
      CI_JOB_NAME: test-standard
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.26.1

      - name: Verify toolchain
        run: |
          node scripts/ci-evidence.mjs run --phase setup -- bash -euc '
            test "$(node --version | sed "s/^v//" | cut -d. -f1)" = "24"
            test "$(pnpm --version)" = "10.26.1"
          '

      - name: Install dependencies
        run: node scripts/ci-evidence.mjs run --phase dependency-install -- pnpm install --frozen-lockfile

      - name: Install Playwright browsers and Linux dependencies
        run: node scripts/ci-evidence.mjs run --phase browser-install -- pnpm --filter @workspace/html-port-studio exec playwright install --with-deps chromium firefox

      - name: Run canonical application validation
        run: node scripts/ci-evidence.mjs run --phase command -- pnpm run test-standard

      - name: Publish compact CI summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_UPLOAD_STATUS: workflow-diagnostic-only
          CI_TIER_NAME: test-standard
          CI_ARTIFACT_NAME: ci-diagnostic-test-standard-${{ github.run_id }}
        run: node scripts/ci-evidence.mjs publish

  validate-api:
    name: validate-api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI_EVIDENCE_FILE: ${{ runner.temp }}/ci-evidence-validate-api.json
      CI_EVIDENCE_ARTIFACT_FILE: ${{ runner.temp }}/ci-evidence-validate-api.artifact.json
      CI_JOB_NAME: validate-api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.26.1

      - name: Verify toolchain
        run: |
          node scripts/ci-evidence.mjs run --phase setup -- bash -euc '
            test "$(node --version | sed "s/^v//" | cut -d. -f1)" = "24"
            test "$(pnpm --version)" = "10.26.1"
          '

      - name: Install dependencies
        run: node scripts/ci-evidence.mjs run --phase dependency-install -- pnpm install --frozen-lockfile

      - name: Run generated API validation
        run: node scripts/ci-evidence.mjs run --phase command -- pnpm run validate:api

      - name: Publish compact CI summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_UPLOAD_STATUS: workflow-diagnostic-only
          CI_TIER_NAME: validate-api
          CI_ARTIFACT_NAME: ci-diagnostic-validate-api-${{ github.run_id }}
        run: node scripts/ci-evidence.mjs publish

  validation:
    name: validation
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    needs:
      - test-standard
      - validate-api
      - production-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          TEST_STANDARD_RESULT: ${{ needs.test-standard.result }}
          VALIDATE_API_RESULT: ${{ needs.validate-api.result }}
          PRODUCTION_BUILD_RESULT: ${{ needs.production-build.result }}
        run: |
          set -eu
          for result in "$TEST_STANDARD_RESULT" "$VALIDATE_API_RESULT" "$PRODUCTION_BUILD_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Validation aggregate rejected upstream result: $result"
              exit 1
            fi
          done

  production-build:
    name: production-build
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_EVIDENCE_FILE: ${{ runner.temp }}/ci-evidence-production-build.json
      CI_EVIDENCE_ARTIFACT_FILE: ${{ runner.temp }}/ci-evidence-production-build.artifact.json
      CI_JOB_NAME: production-build
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.26.1

      - name: Verify toolchain
        run: |
          node scripts/ci-evidence.mjs run --phase setup -- bash -euc '
            test "$(node --version | sed "s/^v//" | cut -d. -f1)" = "24"
            test "$(pnpm --version)" = "10.26.1"
          '

      - name: Install dependencies
        run: node scripts/ci-evidence.mjs run --phase dependency-install -- pnpm install --frozen-lockfile

      - name: Run canonical production build
        run: node scripts/ci-evidence.mjs run --phase command -- pnpm run production-build

      - name: Publish compact CI summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_UPLOAD_STATUS: workflow-diagnostic-only
          CI_TIER_NAME: production-build
          CI_ARTIFACT_NAME: ci-diagnostic-production-build-${{ github.run_id }}
        run: node scripts/ci-evidence.mjs publish

  ci-diagnostics:
    name: ci-diagnostics
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    needs:
      - test-standard
      - validate-api
      - production-build
      - validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare bounded workflow diagnostics
        id: prepare
        if: ${{ always() }}
        continue-on-error: true
        env:
          EVIDENCE_OUTPUT: ${{ runner.temp }}/ci-evidence-workflow.artifact.json
          EVIDENCE_WORKFLOW: github-validation
          EVIDENCE_JOB: ci-diagnostics
          EVIDENCE_EVENT: ${{ github.event_name }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_SHA: ${{ github.sha }}
          EVIDENCE_REF: ${{ github.ref }}
          EVIDENCE_ARTIFACT_NAME: ci-diagnostic-workflow-${{ github.run_id }}
          EVIDENCE_TIER: workflow-aggregate
          EVIDENCE_UPSTREAM: >-
            {"test-standard":"${{ needs.test-standard.result }}","validate-api":"${{ needs.validate-api.result }}","production-build":"${{ needs.production-build.result }}","validation":"${{ needs.validation.result }}"}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const maxBytes = 16 * 1024;
          const allowedStatuses = new Set(["success", "failure", "cancelled", "skipped"]);
          const raw = JSON.parse(process.env.EVIDENCE_UPSTREAM);
          const upstream = Object.fromEntries(
            Object.entries(raw).map(([name, status]) => [
              name,
              allowedStatuses.has(status) ? status : "failure",
            ]),
          );
          const values = Object.values(upstream);
          const status = values.includes("cancelled")
            ? "cancelled"
            : values.includes("failure")
              ? "failure"
              : values.includes("skipped")
                ? "skipped"
                : "success";
          const envelope = {
            version: 1,
            metadata: {
              workflow: process.env.EVIDENCE_WORKFLOW,
              job: process.env.EVIDENCE_JOB,
              event: process.env.EVIDENCE_EVENT,
              runId: process.env.EVIDENCE_RUN_ID,
              runAttempt: Number(process.env.EVIDENCE_RUN_ATTEMPT),
              commitSha: process.env.EVIDENCE_SHA,
              ref: process.env.EVIDENCE_REF.slice(0, 160),
            },
            lifecycle: {
              status,
              jobStatus: "diagnostic",
              conclusion: status,
              expectedSkips: [],
              upstream,
            },
            outcome: { diagnostic: "independent", authoritative: "unchanged" },
            metrics: {
              phases: [],
              retryCount: Math.max(0, Number(process.env.EVIDENCE_RUN_ATTEMPT) - 1),
              cancelled: status === "cancelled",
              uploadStatus: "pending",
              artifactSizeBytes: 0,
              artifactSizeLimitBytes: maxBytes,
            },
            artifacts: [{
              name: process.env.EVIDENCE_ARTIFACT_NAME,
              kind: "compact-evidence",
              condition: "failure-or-cancellation",
              retentionDays: 3,
              maxBytes,
            }],
            localComparison: {
              status: "not-compared",
              tier: process.env.EVIDENCE_TIER,
            },
            excerpts: [
              `Upstream statuses: ${Object.entries(upstream).map(([name, value]) => `${name}=${value}`).join(", ")}`,
            ],
            redactions: [
              "source and imported content",
              "full logs and command output",
              "provider payloads and request identifiers",
              "environment values, credentials, and secrets",
              "Playwright traces, videos, DOM snapshots, and unapproved screenshots",
            ],
          };
          let body = "";
          for (let attempt = 0; attempt < 4; attempt += 1) {
            body = `${JSON.stringify(envelope, null, 2)}\n`;
            const bytes = Buffer.byteLength(body);
            if (bytes > maxBytes) throw new Error("CI evidence exceeded 16 KiB");
            if (envelope.metrics.artifactSizeBytes === bytes) break;
            envelope.metrics.artifactSizeBytes = bytes;
          }
          fs.writeFileSync(process.env.EVIDENCE_OUTPUT, body, { flag: "wx" });
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## CI diagnostic summary\n\n- Lifecycle: \`${status}\`\n- Upstream: ${envelope.excerpts[0]}\n- Artifact: bounded status-only evidence; authoritative validation is unchanged\n`,
          );
          NODE

      - name: Upload bounded workflow diagnostics
        id: upload
        if: ${{ always() && steps.prepare.outcome == 'success' && (needs.test-standard.result != 'success' || needs.validate-api.result != 'success' || needs.production-build.result != 'success' || needs.validation.result != 'success') }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostic-workflow-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-evidence-workflow.artifact.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Report diagnostic upload outcome
        if: ${{ always() }}
        continue-on-error: true
        env:
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: printf '%s\n' "- Upload outcome: \`${EVIDENCE_UPLOAD_OUTCOME:-not-run}\`" >> "$GITHUB_STEP_SUMMARY"
