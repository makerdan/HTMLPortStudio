name: Post-merge production build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: post-merge-production-build-main
  cancel-in-progress: true

jobs:
  eligibility:
    name: post-merge-eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI_EVIDENCE_FILE: ${{ runner.temp }}/ci-evidence-eligibility.json
      CI_EVIDENCE_ARTIFACT_FILE: ${{ runner.temp }}/ci-evidence-eligibility.artifact.json
      CI_JOB_NAME: post-merge-eligibility
      CI_BROWSER_PROJECT: not-applicable
      CI_API_SCOPE: not-applicable
      CI_VALIDATION_SCOPE: post-merge-eligibility-policy
    outputs:
      run-build: ${{ steps.policy.outputs.run-build }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - name: Start CI cost timer
        run: echo "CI_JOB_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Check out default branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.26.1

      - name: Verify toolchain
        run: |
          node scripts/ci-evidence.mjs run --phase setup -- bash -euc '
            test "$(node --version | sed "s/^v//" | cut -d. -f1)" = "24"
            test "$(pnpm --version)" = "10.26.1"
          '

      - name: Find prior successful post-merge builds
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep eligibility work bounded as workflow history grows. The job
          # lookup below still distinguishes a skipped build from a verified
          # post-merge run.
          history_page_size=100
          prior_head=""
          current_verified="false"
          while IFS=$'\t' read -r run_id head_sha; do
            [ -n "$run_id" ] || continue
            conclusion="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
              --jq '.jobs[] | select(.name == "post-merge-build") | .conclusion' | head -n 1 || true)"
            if [ "$conclusion" = "success" ]; then
              if [ "$head_sha" = "$GITHUB_SHA" ]; then
                current_verified="true"
                break
              fi
              if [ -z "$prior_head" ]; then
                prior_head="$head_sha"
              fi
            fi
          done < <(
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/production-build.yml/runs?branch=main&status=success&per_page=${history_page_size}" \
              --jq '.workflow_runs[] | [.id, .head_sha] | @tsv'
          )
          echo "current-verified=$current_verified" >> "$GITHUB_OUTPUT"
          echo "prior-head=$prior_head" >> "$GITHUB_OUTPUT"

      - name: Count commits and evaluate coalescing policy
        id: policy
        env:
          CURRENT_VERIFIED: ${{ steps.history.outputs.current-verified }}
          PRIOR_HEAD: ${{ steps.history.outputs.prior-head }}
        run: |
          set -euo pipefail
          newest_commit_unix="$(git show -s --format=%ct "$GITHUB_SHA")"
          now_unix="$(date +%s)"
          if [ -n "$PRIOR_HEAD" ]; then
            commits_since_success="$(git rev-list --count "${PRIOR_HEAD}..${GITHUB_SHA}")"
          else
            commits_since_success="$(git rev-list --count "$GITHUB_SHA")"
          fi
          policy_input="${RUNNER_TEMP}/post-merge-policy-input.json"
          policy_output="${RUNNER_TEMP}/post-merge-policy-output.json"
          cat > "$policy_input" <<JSON
          {
            "currentSha": "$GITHUB_SHA",
            "currentVerified": $CURRENT_VERIFIED,
            "newestCommitUnix": $newest_commit_unix,
            "nowUnix": $now_unix,
            "commitsSinceLastSuccess": $commits_since_success
          }
          JSON
          node scripts/ci-evidence.mjs run --phase eligibility -- \
            bash -euc 'node scripts/post-merge-build-policy.mjs < "$1" > "$2"' \
            bash "$policy_input" "$policy_output"
          decision="$(cat "$policy_output")"
          echo "$decision"
          node -e 'const decision = JSON.parse(process.argv[1]); if (!decision.run) process.exit(1)' "$decision" \
            && run_build="true" || run_build="false"
          reason="$(node -e 'console.log(JSON.parse(process.argv[1]).reason)' "$decision")"
          echo "run-build=$run_build" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Explain skipped verification
        if: ${{ steps.policy.outputs.run-build != 'true' }}
        run: 'echo "Post-merge production build skipped: ${{ steps.policy.outputs.reason }}"'

      - name: Publish compact CI summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_UPLOAD_STATUS: workflow-diagnostic-only
          CI_TIER_NAME: post-merge-eligibility
          CI_COMMAND: post-merge eligibility policy
          CI_ARTIFACT_NAME: ci-diagnostic-eligibility-${{ github.run_id }}
        run: node scripts/ci-evidence.mjs publish

  post-merge-build:
    name: post-merge-build
    needs: eligibility
    if: ${{ needs.eligibility.outputs.run-build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_EVIDENCE_FILE: ${{ runner.temp }}/ci-evidence-post-merge-build.json
      CI_EVIDENCE_ARTIFACT_FILE: ${{ runner.temp }}/ci-evidence-post-merge-build.artifact.json
      CI_JOB_NAME: post-merge-build
      CI_BROWSER_PROJECT: not-applicable
      CI_API_SCOPE: not-applicable
      CI_VALIDATION_SCOPE: post-merge-production-build
    steps:
      - name: Start CI cost timer
        run: echo "CI_JOB_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.26.1

      - name: Verify toolchain
        run: |
          node scripts/ci-evidence.mjs run --phase setup -- bash -euc '
            test "$(node --version | sed "s/^v//" | cut -d. -f1)" = "24"
            test "$(pnpm --version)" = "10.26.1"
          '

      - name: Install dependencies
        run: node scripts/ci-evidence.mjs run --phase dependency-install -- pnpm install --frozen-lockfile

      - name: Run canonical production build
        run: node scripts/ci-evidence.mjs run --phase command -- pnpm run production-build

      - name: Publish compact CI summary
        if: ${{ always() }}
        continue-on-error: true
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_UPLOAD_STATUS: workflow-diagnostic-only
          CI_TIER_NAME: post-merge-build
          CI_COMMAND: pnpm run production-build
          CI_ARTIFACT_NAME: ci-diagnostic-post-merge-build-${{ github.run_id }}
        run: node scripts/ci-evidence.mjs publish

  post-merge-diagnostics:
    name: post-merge-diagnostics
    if: ${{ always() }}
    needs:
      - eligibility
      - post-merge-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Start CI cost timer
        run: echo "CI_JOB_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Start diagnostic upload timer
        if: ${{ always() }}
        run: echo "CI_UPLOAD_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Prepare bounded workflow diagnostics
        id: prepare
        if: ${{ always() }}
        continue-on-error: true
        env:
          EVIDENCE_OUTPUT: ${{ runner.temp }}/ci-evidence-workflow.artifact.json
          EVIDENCE_WORKFLOW: post-merge-production-build
          EVIDENCE_JOB: post-merge-diagnostics
          EVIDENCE_EVENT: ${{ github.event_name }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_SHA: ${{ github.sha }}
          EVIDENCE_REF: ${{ github.ref }}
          EVIDENCE_ARTIFACT_NAME: ci-diagnostic-post-merge-production-build-post-merge-diagnostics-${{ github.run_id }}
          EVIDENCE_TIER: post-merge-workflow
          EVIDENCE_EXPECTED_SKIPS: ${{ needs.eligibility.result == 'success' && needs.eligibility.outputs.run-build != 'true' && 'post-merge-build' || '' }}
          EVIDENCE_UPSTREAM: >-
            {"eligibility":"${{ needs.eligibility.result }}","post-merge-build":"${{ needs.post-merge-build.result }}"}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const maxBytes = 16 * 1024;
          const allowedStatuses = new Set(["success", "failure", "cancelled", "skipped"]);
          const raw = JSON.parse(process.env.EVIDENCE_UPSTREAM);
          const upstream = Object.fromEntries(
            Object.entries(raw).map(([name, status]) => [
              name,
              allowedStatuses.has(status) ? status : "failure",
            ]),
          );
          const expectedSkips = String(process.env.EVIDENCE_EXPECTED_SKIPS || "")
            .split(",")
            .filter(Boolean);
          const effective = Object.entries(upstream)
            .filter(([name, status]) => !(status === "skipped" && expectedSkips.includes(name)))
            .map(([, status]) => status);
          const status = effective.includes("cancelled")
            ? "cancelled"
            : effective.includes("failure")
              ? "failure"
              : effective.includes("skipped")
                ? "skipped"
                : "success";
          const envelope = {
            version: 1,
            metadata: {
              workflow: process.env.EVIDENCE_WORKFLOW,
              job: process.env.EVIDENCE_JOB,
              event: process.env.EVIDENCE_EVENT,
              runId: process.env.EVIDENCE_RUN_ID,
              runAttempt: Number(process.env.EVIDENCE_RUN_ATTEMPT),
              commitSha: process.env.EVIDENCE_SHA,
              ref: process.env.EVIDENCE_REF.slice(0, 160),
              browserProject: "not-applicable",
              apiScope: "not-applicable",
              validationScope: "post-merge-workflow",
            },
            lifecycle: {
              status,
              jobStatus: "diagnostic",
              conclusion: status,
              expectedSkips,
              upstream,
            },
            outcome: { diagnostic: "independent", authoritative: "unchanged" },
            metrics: {
              phases: [],
              jobDurationMs: Math.min(
                Math.max(
                  0,
                  Date.now() -
                    Number(process.env.CI_JOB_STARTED_AT_MS || Date.now()),
                ),
                60 * 60 * 1000,
              ),
              setupDurationMs: 0,
              dependencyInstallDurationMs: 0,
              browserInstallDurationMs: 0,
              eligibilityDurationMs: 0,
              commandDurationMs: 0,
              uploadDurationMs: 0,
              retryCount: Math.max(0, Number(process.env.EVIDENCE_RUN_ATTEMPT) - 1),
              cancelled: status === "cancelled",
              uploadStatus: "pending",
              artifactSizeBytes: 0,
              artifactSizeLimitBytes: maxBytes,
            },
            artifacts: [{
              name: process.env.EVIDENCE_ARTIFACT_NAME,
              kind: "compact-evidence",
              condition: "failure-or-unexpected-non-success",
              retentionDays: 3,
              maxBytes,
            }],
            localComparison: {
              status: "not-compared",
              tier: process.env.EVIDENCE_TIER,
            },
            excerpts: [
              `Upstream statuses: ${Object.entries(upstream).map(([name, value]) => `${name}=${value}`).join(", ")}`,
            ],
            redactions: [
              "repository dumps, source bundles, and imported HTML",
              "full logs, full dependency-install logs, and command output",
              "provider payloads, prompts, and request identifiers",
              "environment files and values, credentials, and secrets",
              "unbounded browser traces, videos, DOM snapshots, and screenshots",
            ],
          };
          let body = "";
          for (let attempt = 0; attempt < 4; attempt += 1) {
            body = `${JSON.stringify(envelope, null, 2)}\n`;
            const bytes = Buffer.byteLength(body);
            if (bytes > maxBytes) throw new Error("CI evidence exceeded 16 KiB");
            if (envelope.metrics.artifactSizeBytes === bytes) break;
            envelope.metrics.artifactSizeBytes = bytes;
          }
          fs.writeFileSync(process.env.EVIDENCE_OUTPUT, body, { flag: "wx" });
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## CI diagnostic summary\n\n- Lifecycle: \`${status}\`\n- Scope: validation \`${envelope.metadata.validationScope}\`; browser project \`${envelope.metadata.browserProject}\`; API scope \`${envelope.metadata.apiScope}\`\n- Duration: job=\`${envelope.metrics.jobDurationMs}ms\`; setup=\`${envelope.metrics.setupDurationMs}ms\`; dependency-install=\`${envelope.metrics.dependencyInstallDurationMs}ms\`; browser-install=\`${envelope.metrics.browserInstallDurationMs}ms\`; eligibility=\`${envelope.metrics.eligibilityDurationMs}ms\`; command=\`${envelope.metrics.commandDurationMs}ms\`\n- Upstream: ${envelope.excerpts[0]}\n- Artifact: size \`${envelope.metrics.artifactSizeBytes} bytes\`; bounded status-only evidence; authoritative validation is unchanged\n`,
          );
          NODE

      - name: Upload bounded workflow diagnostics
        id: upload
        if: ${{ always() && steps.prepare.outcome == 'success' && (needs.eligibility.result != 'success' || needs.post-merge-build.result == 'failure' || needs.post-merge-build.result == 'cancelled' || (needs.post-merge-build.result == 'skipped' && needs.eligibility.outputs.run-build == 'true')) }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostic-post-merge-production-build-post-merge-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-evidence-workflow.artifact.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Report diagnostic upload outcome
        if: ${{ always() }}
        continue-on-error: true
        env:
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -eu
          upload_duration_ms=0
          case "${EVIDENCE_UPLOAD_OUTCOME:-not-run}" in
            success|failure|cancelled)
              now_ms="$(date +%s%3N)"
              started_ms="${CI_UPLOAD_STARTED_AT_MS:-$now_ms}"
              upload_duration_ms="$((now_ms - started_ms))"
              [ "$upload_duration_ms" -ge 0 ] || upload_duration_ms=0
              [ "$upload_duration_ms" -le 900000 ] || upload_duration_ms=900000
              ;;
          esac
          {
            printf '%s\n' "- Upload outcome: \`${EVIDENCE_UPLOAD_OUTCOME:-not-run}\`"
            printf '%s\n' "- Upload duration: \`${upload_duration_ms} ms\`"
          } >> "$GITHUB_STEP_SUMMARY"
